<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>

    <header class="header">
        <nav class="header__nav">
            <a class="header__logo" href="../index.html">Genesis</a>

            <ul class="header__list">
                <li><a href="project-details.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact">

        <section class="contact__intro">
            <div>
                <h1>Full set of great features to make your product fresh</h1>

                <p>
                    Our favorite brands are our friends! We help them to achieve
                    their goals, they help us to stay sharp.
                </p>
            </div>

            <form class="contact__form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email">

                <label for="message">Message</label>
                <input type="text" id="message" name="message">

                <button type="submit">Submit</button>
            </form>
        </section>

        <div class="contact__map">
            <img src="../images/Map.png" alt="Map showing the project location">
        </div>

    </main>

    <footer class="footer">
        <a class="footer__logo" href="../index.html">Genesis</a>

        <nav class="footer__nav">
            <a href="project-details.html">Projects</a>
            <a href="contact.html">Contact</a>
            <a href="#">◎</a>
            <a href="#">◎</a>
            <a href="#">♥</a>
        </nav>
    </footer>

</body>
</html>
